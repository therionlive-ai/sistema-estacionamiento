<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LKCO - Registro tributario</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"><link href="../css/dashboard.css" rel="stylesheet"></head><body><div class="container py-4"><h3>Registro tributario</h3><p class="text-muted">Configuración fiscal del establecimiento actual.</p><div id="msg"></div><form id="fiscal" class="row g-3"><div class="col-md-6"><label class="form-label">RTN</label><input id="rtn" class="form-control" required></div><div class="col-md-6"><label class="form-label">Razón social</label><input id="razon_social" class="form-control" required></div><div class="col-md-6"><label class="form-label">Nombre comercial</label><input id="nombre_comercial" class="form-control"></div><div class="col-md-6"><label class="form-label">Actividad económica</label><input id="actividad_economica" class="form-control"></div><div class="col-12"><label class="form-label">Dirección fiscal</label><input id="direccion_fiscal" class="form-control"></div><div class="col-md-4"><label class="form-label">CAI</label><input id="cai" class="form-control"></div><div class="col-md-4"><label class="form-label">Vencimiento CAI</label><input id="fecha_vencimiento_cai" type="date" class="form-control"></div><div class="col-md-4"><label class="form-label">Estado</label><select id="estado" class="form-select"><option value="pendiente">Pendiente</option><option value="activo">Activo</option><option value="vencido">Vencido</option><option value="inactivo">Inactivo</option></select></div><div class="col-12"><label class="form-label">Observaciones</label><textarea id="observaciones" class="form-control"></textarea></div><div class="col-12"><button class="btn btn-primary">Guardar registro tributario</button></div></form><hr><h4>Archivo tributario</h4><form id="archivo" class="row g-2"><div class="col-md-8"><input type="file" id="archivoInput" class="form-control" required></div><div class="col-md-4"><button class="btn btn-outline-primary w-100">Guardar archivo</button></div></form><hr><h4>Secuencias fiscales</h4><form id="seq" class="row g-2"><div class="col-md-3"><input id="tipo_documento" class="form-control" placeholder="Tipo documento" required></div><div class="col-md-2"><input id="prefijo" class="form-control" placeholder="Prefijo"></div><div class="col-md-2"><input id="rango_desde" type="number" class="form-control" placeholder="Desde" required></div><div class="col-md-2"><input id="rango_hasta" type="number" class="form-control" placeholder="Hasta" required></div><div class="col-md-2"><input id="correlativo_actual" type="number" class="form-control" placeholder="Actual"></div><div class="col-md-1"><button class="btn btn-primary">Guardar</button></div></form><div id="secuencias" class="mt-3"></div></div><script>const T=localStorage.getItem('token');if(!T||![ 'admin', 'operador' ].includes(localStorage.getItem('userRole')))location='/admin/dashboard';const h={'Authorization':'Bearer '+T};async function load(){const r=await fetch('/api/fiscal',{headers:h}),j=await r.json();if(!j.success)return;const x=j.data.registro||{};for(const k of ['rtn','razon_social','nombre_comercial','actividad_economica','direccion_fiscal','cai','fecha_vencimiento_cai','estado','observaciones']){if(document.getElementById(k))document.getElementById(k).value=x[k]||''}document.getElementById('secuencias').innerHTML=(j.data.secuencias||[]).map(s=>`<div class="alert alert-light">${s.tipo_documento}: ${s.prefijo||''}${s.correlativo_actual} / rango ${s.rango_desde}-${s.rango_hasta}</div>`).join('')}fiscal.onsubmit=async e=>{e.preventDefault();const b={};for(const k of ['rtn','razon_social','nombre_comercial','actividad_economica','direccion_fiscal','cai','fecha_vencimiento_cai','estado','observaciones'])b[k]=document.getElementById(k).value;const r=await fetch('/api/fiscal/registro',{method:'PUT',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json();msg.innerHTML=`<div class="alert ${j.success?'alert-success':'alert-danger'}">${j.message}</div>`;load()};archivo.onsubmit=async e=>{e.preventDefault();const f=new FormData();f.append('archivo',archivoInput.files[0]);const r=await fetch('/api/fiscal/archivo',{method:'POST',headers:h,body:f});const j=await r.json();msg.innerHTML=`<div class="alert ${j.success?'alert-success':'alert-danger'}">${j.message}</div>`};seq.onsubmit=async e=>{e.preventDefault();const b={tipo_documento:tipo_documento.value,prefijo:prefijo.value,rango_desde:rango_desde.value,rango_hasta:rango_hasta.value,correlativo_actual:correlativo_actual.value};const r=await fetch('/api/fiscal/secuencias',{method:'POST',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json();msg.innerHTML=`<div class="alert ${j.success?'alert-success':'alert-danger'}">${j.message}</div>`;load()};load();</script></body></html>
