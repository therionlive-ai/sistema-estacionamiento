<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LKCO - Convenios</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"><link href="../css/dashboard.css" rel="stylesheet"></head><body><div class="container py-4"><h3>Convenios y beneficios</h3><p class="text-muted">Los beneficios quedan registrados y trazables; no se convierten en tarifas de L 0.</p><div id="msg"></div><form id="f" class="row g-2"><div class="col-md-4"><input id="nombre" class="form-control" placeholder="Nombre" required></div><div class="col-md-3"><select id="tipo" class="form-select"><option value="horas_gratis">Horas gratis</option><option value="porcentaje">Porcentaje</option><option value="monto">Monto</option><option value="tarifa_especial">Tarifa especial</option><option value="indefinido_horario">Indefinido por horario</option></select></div><div class="col-md-2"><input id="valor" type="number" step="0.01" class="form-control" placeholder="Valor"></div><div class="col-md-3"><button class="btn btn-primary">Crear convenio</button></div><div class="col-12"><textarea id="descripcion" class="form-control" placeholder="Descripción"></textarea></div></form><hr><div id="lista"></div></div><script>const T=localStorage.getItem('token');if(!T||!['admin','operador'].includes(localStorage.getItem('userRole')))location='/admin/dashboard';const h={'Authorization':'Bearer '+T};async function load(){const r=await fetch('/api/convenios',{headers:h}),j=await r.json();lista.innerHTML=(j.data||[]).map(x=>`<div class="card mb-2"><div class="card-body"><b>${x.nombre}</b> <span class="badge ${x.activo?'bg-success':'bg-secondary'}">${x.activo?'Activo':'Inactivo'}</span><div>${x.descripcion||''}</div><small>${x.tipo_beneficio} · ${x.valor_beneficio}</small></div></div>`).join('')}f.onsubmit=async e=>{e.preventDefault();const b={nombre:nombre.value,descripcion:descripcion.value,tipo_beneficio:tipo.value,valor_beneficio:valor.value};const r=await fetch('/api/convenios',{method:'POST',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json();msg.innerHTML=`<div class="alert ${j.success?'alert-success':'alert-danger'}">${j.message}</div>`;load()};load();</script></body></html>
